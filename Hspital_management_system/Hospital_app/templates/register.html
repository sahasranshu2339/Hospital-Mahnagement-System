<!DOCTYPE html>
<html>

<head>

<title>Registration</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-green-50 flex items-center justify-center h-screen">

<div class="bg-white shadow-lg rounded-lg p-8 w-96">

<h2 class="text-2xl font-bold text-center text-green-600 mb-6">
User Registration
</h2>

<form method="POST">

{% csrf_token %}

<label class="block mb-2 font-semibold">
Username
</label>

<input
type="text"
name="username"
class="w-full p-2 border rounded mb-4 focus:outline-none focus:ring-2 focus:ring-green-400"
/>

<label class="block mb-2 font-semibold">
Email
</label>

<input
type="email"
name="email"
class="w-full p-2 border rounded mb-4 focus:outline-none focus:ring-2 focus:ring-green-400"
/>

<label class="block mb-2 font-semibold">
Password
</label>

<input
type="password"
name="password"
class="w-full p-2 border rounded mb-4 focus:outline-none focus:ring-2 focus:ring-green-400"
/>

<label class="block mb-2 font-semibold">
Select Role
</label>

<select
name="role"
class="w-full p-2 border rounded mb-6 focus:outline-none focus:ring-2 focus:ring-green-400"
required
>

<option value="">Choose role</option>

<option value="PATIENT">Patient</option>

<option value="DOCTOR">Doctor</option>

</select>

<button
class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700 transition duration-300"
type="submit"
>
Register
</button>

</form>

<p class="mt-4 text-center">

Already have an account?

<a href="/login/" class="text-green-600 font-semibold">
Login here
</a>

</p>

</div>

</body>

</html>
